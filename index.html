<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Competition App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }
    body.theme-pink {
      --bg-body: #fde2e4;
      --bg-container: #ffccd5;
      --bg-card: #fff0f5;
      --bg-nav: #ffb3c6;
      --bg-btn: #ff4d6d;
      --text-main: #2b2b2b;
      --text-btn: #fff;
      --border-color: #333;
    }
    body.theme-bluegreen {
      --bg-body: #e0f4f7;
      --bg-container: #b9e8ea;
      --bg-card: #f0fdfa;
      --bg-nav: #8fd3f4;
      --bg-btn: #0284c7;
      --text-main: #134e4a;
      --text-btn: #fff;
      --border-color: #1e3a8a;
    }
    body.theme-yelloworange {
      --bg-body: #fef9c3;
      --bg-container: #fde047;
      --bg-card: #fffbeb;
      --bg-nav: #fcd34d;
      --bg-btn: #f97316;
      --text-main: #78350f;
      --text-btn: #fff;
      --border-color: #7c2d12;
    }
    body.theme-rainbow {
      --bg-body: #fce7f3;
      --bg-container: linear-gradient(135deg, #fecaca, #fef08a, #bbf7d0, #bfdbfe);
      --bg-card: #fff;
      --bg-nav: #e9d5ff;
      --bg-btn: #8b5cf6;
      --text-main: #3b0764;
      --text-btn: #fff;
      --border-color: #4c1d95;
    }
    body.theme-bw {
      --bg-body: #f4f4f5;
      --bg-container: #fff;
      --bg-card: #fafafa;
      --bg-nav: #e4e4e7;
      --bg-btn: #18181b;
      --text-main: #09090b;
      --text-btn: #fff;
      --border-color: #18181b;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }
    #app-container {
      width: 100%;
      max-width: 950px;
      background: var(--bg-container);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 0 var(--border-color);
    }
    .top-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 0 var(--border-color);
    }
    .user-badge-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: #ccc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-badge-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .user-badge-name {
      font-weight: 700;
      font-size: 14px;
    }
    .navbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-tab {
      flex: 1;
      padding: 12px 6px;
      text-align: center;
      background: var(--bg-nav);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .nav-tab.active {
      background: var(--bg-btn);
      color: var(--text-btn);
    }
    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      position: relative;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
      background: #fff;
      color: #000;
      font-size: 14px;
    }
    .btn {
      background: var(--bg-btn);
      color: var(--text-btn);
      border: 2px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      box-shadow: 0 3px 0 var(--border-color);
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-color);
    }
    .pie-chart {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(#b7e4c7 0 65%, #a2d2ff 65% 85%, #ffadad 85% 100%);
      border: 2px solid var(--border-color);
      margin: 10px auto;
    }
    .response-card {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .chat-box {
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .chat-msg {
      margin-bottom: 8px;
    }
    .profile-avatar {
      width: 180px;
      height: 180px;
      border-radius: 40px;
      border: 2px solid var(--border-color);
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #auth-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-body, #fde2e4); padding: 20px;
    }
    #auth-card {
      width: 100%; max-width: 440px; background: var(--bg-card, #fff0f5);
      border: 2px solid var(--border-color, #333); border-radius: 16px;
      padding: 28px; box-shadow: 0 8px 0 var(--border-color, #333);
    }
    #auth-card h1 { margin-top: 0; }
    .auth-tabs { display:flex; gap:8px; margin-bottom:16px; }
    .auth-tab { flex:1; }
    .auth-divider { display:flex; align-items:center; gap:10px; margin:14px 0; color:#666; }
    .auth-divider::before, .auth-divider::after { content:""; flex:1; border-top:1px solid #aaa; }
    .google-btn { background:#fff; color:#222; border:2px solid #333; }
    .auth-error { color:#b91c1c; min-height:20px; font-size:13px; margin:6px 0; }
    .logout-btn { margin-left:auto; }

  </style>

  
</head>
<body>

  <div id="auth-screen" style="display:none;">
    <div id="auth-card">
      <h1>🧮 Math Competition Hub</h1>
      <p>Sign in to keep your contests, profile, community activity, and AI conversations attached to your own account.</p>

      <div class="auth-tabs">
        <button class="btn auth-tab" id="loginTab" onclick="setAuthMode('login')">Log in</button>
        <button class="btn auth-tab" id="registerTab" onclick="setAuthMode('register')">Create account</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="authForm" onsubmit="submitAuth(event)">
        <label>Username</label>
        <input id="authUsername" autocomplete="username" required minlength="3" maxlength="32">
        <div id="authEmailWrap">
          <label>Email</label>
          <input id="authEmail" type="email" autocomplete="email">
        </div>
        <label>Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" required minlength="8">
        <button class="btn" style="width:100%;" id="authSubmit">Log in</button>
      </form>

      <div class="auth-divider">or</div>
      <button class="btn google-btn" style="width:100%;" onclick="window.location.href='/auth/google'">
        Continue with Google
      </button>
      <p style="font-size:12px;color:#666;margin-bottom:0;">
        Google login is configured by the site owner through OAuth credentials. Passwords are hashed before storage.
      </p>
    </div>
  </div>

  <div id="app-container"></div>
  <input type="file" id="pfpFileInput" accept="image/*" style="display:none" onchange="handlePfpUpload(event)">

  <script>
    const appState = {
      currentTab: 'dashboard',
      logFlowStep: 0,
      communityStep: 'default',
      selectedContest: 'AMC 10A 2016',
      currentTheme: 'theme-pink',
      apiKey: '', // retained only for backward-compatible UI; never used for server calls
      authenticated: false,
      authMode: 'login',
      authError: '',
      aiChatHistory: [],
      aiLoading: false,
      pfpUrl: null,
      user: {
        username: '',
        location: '',
        status: '',
        birthday: '',
        llm: 'GPT-5.6 Luna',
        id: null,
        email: ''
      },
      pastContestLogs: [
        { id: 1, title: 'AMC 10A 2016', date: '7/23/26' },
        { id: 2, title: 'AMC 10B 2015', date: '7/21/26' },
        { id: 3, title: 'MATHCOUNTS Chapter 2024 Sprint', date: '3/11/22' }
      ],
      upcomingCompetitions: [
        { id: 1, name: 'AMC 10A', dateStr: '11/5/26', dateObj: '2026-11-05' },
        { id: 2, name: 'AMC 10B', dateStr: '11/13/26', dateObj: '2026-11-13' }
      ],
      communityResponses: [
        { id: 1, author: "Username_465", text: "", date: "2099-1-1", likes: 0 },
        { id: 2, author: "Ilovemath", text: "Sndfnaflnlsdnflskndflkdfsd", date: "2099-1-1", likes: 2 },
        { id: 3, author: "Rabbitybabbity", text: "I am a rabbit", date: "2099-1-1", likes: 5 },
        { id: 4, author: "math_journey_lover", text: "hi", date: "2099-1-1", likes: 1 }
      ]
    };

    function setTheme(e) {
      document.body.className = e;
      appState.currentTheme = e;
    }

    function promptChangeTheme() {
      const e = prompt("Choose a Theme (type number):\n1. Pink\n2. Blue + Green\n3. Yellow + Orange\n4. Rainbow\n5. Black & White Minimalist", "1");
      const t = {
        "1": "theme-pink",
        "2": "theme-bluegreen",
        "3": "theme-yelloworange",
        "4": "theme-rainbow",
        "5": "theme-bw"
      };
      if (e && t[e.trim()]) {
        setTheme(t[e.trim()]);
      }
    }

    function renderApp() {
      document.getElementById("app-container").innerHTML = `
        ${renderTopHeader()}
        ${renderNavigation()}
        <div class="tab-content">
          ${renderCurrentTab()}
        </div>
      `;
    }

    function renderTopHeader() {
      return `
        <div class="top-header">
          <div class="user-badge">
            <div class="user-badge-avatar">
              ${appState.pfpUrl ? `<img src="${appState.pfpUrl}" alt="Avatar">` : '<svg width="20" height="20" viewBox="0 0 24 24" fill="#666"><path d="M12 12c2.21 0 4-1.79-4-4s-4 4-4 4 4 4 4 4 4-4 4-4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>'}
            </div>
            <span class="user-badge-name">👤 ${appState.user.username}</span>
          </div>
          <button class="btn logout-btn" onclick="logout()">Log out</button>
        </div>
      `;
    }

    function renderNavigation() {
      return `
        <div class="navbar">
          ${[
            { id: "dashboard", label: "Dashboard" },
            { id: "log", label: "Log Contests" },
            { id: "community", label: "Community" },
            { id: "about", label: "About us" },
            { id: "settings", label: "Settings" }
          ].map(e => `
            <div
              class="nav-tab ${appState.currentTab === e.id ? "active" : ""}"
              onclick="switchTab('${e.id}')"
            >
              ${e.label}
            </div>
          `).join("")}
        </div>
      `;
    }

    function switchTab(e) {
      appState.currentTab = e;
      if ("community" === e && "post" === appState.communityStep) {
        appState.communityStep = "default";
      }
      renderApp();
    }

    function renderCurrentTab() {
      switch (appState.currentTab) {
        case "dashboard": return renderDashboard();
        case "log": return renderLogContests();
        case "community": return renderCommunity();
        case "about": return renderAboutUs();
        case "settings": return renderSettings();
        default: return renderDashboard();
      }
    }

    function renderDashboard() {
      const e = new Date().toISOString().split("T")[0];
      const t = appState.upcomingCompetitions.filter(t => t.dateObj >= e);
      return `
        <div class="grid-2">
          <div class="card">
            <h3>My last contest:</h3>
            <div class="pie-chart"></div>
            <div style="font-size: 13px; text-align: center; margin-top: 8px;">
              <span style="color:#ffadad">■ Incorrect</span> |
              <span style="color:#a2d2ff">■ Unanswered</span> |
              <span style="color:#b7e4c7">■ Correct</span>
            </div>
          </div>
          <div class="card">
            <h3>Suggested next steps</h3>
            <p><b>Focus on Algebra</b></p>
            <button class="btn" style="width:100%; margin-bottom: 8px;">Suggested problem: AMC 10A 2010 #3</button>
            <button class="btn" style="width:100%;" onclick="appState.currentTab='community'; appState.communityStep='default'; renderApp();">Topics to Learn: Setting up equations</button>
          </div>
        </div>

        <div class="card">
          <h3>My AI agent:</h3>
          <p>💬 <i>"Hello, my name is <b>${appState.user.username}</b>, how can I help?"</i></p>

          <div class="chat-box" id="aiChatBox">
            ${0 === appState.aiChatHistory.length ? "<i>No conversation yet. Ask a question below!</i>" : ""}
            ${appState.aiChatHistory.map(e => `
              <div class="chat-msg"><b>${e.sender}:</b> ${e.text}</div>
            `).join("")}
            ${appState.aiLoading ? '<div class="chat-msg"><i>AI is thinking...</i></div>' : ""}
          </div>

          <div style="display:flex; gap: 8px;">
            <input type="text" id="aiQueryInput" placeholder='Type to ask a question (e.g. "How do I prepare for AMC 10?")' style="margin: 0;" onkeydown="if(event.key==='Enter') sendAiMessage()">
            <button class="btn" style="white-space:nowrap;" onclick="sendAiMessage()">Send</button>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h4>Your upcoming competitions</h4>
            ${t.length > 0 ? t.map(e => `
              <button class="btn" style="width:100%; margin-bottom: 6px;">${e.name} (${e.dateStr})</button>
            `).join("") : `<p style="font-size:13px; color:#666;">No upcoming competitions.</p>`}
          </div>
          <div class="card">
            <h4>Suggested competitions</h4>
            <button class="btn" style="width:100%;">HMMT (11/7/26)</button>
          </div>
        </div>
      `;
    }

    async function sendAiMessage() {
      const input = document.getElementById("aiQueryInput");
      if (!input || !input.value.trim()) return;

      const text = input.value.trim();
      appState.aiChatHistory.push({ sender: appState.user.username, text });
      input.value = "";
      appState.aiLoading = true;
      renderApp();

      try {
        const response = await fetch("/api/ai/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: appState.aiChatHistory.slice(-12)
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "AI request failed");
        appState.aiChatHistory.push({
          sender: "GPT-5.6 Luna",
          text: data.reply
        });
        appState.user.llm = "GPT-5.6 Luna";
      } catch (err) {
        appState.aiChatHistory.push({
          sender: "GPT-5.6 Luna",
          text: "I couldn't reach the AI service right now. Please try again in a moment."
        });
      } finally {
        appState.aiLoading = false;
        renderApp();
      }
    }

    function renderLogContests() {
      if ("history" === appState.logFlowStep) {
        return `
          <div class="card">
            <h2 style="text-align: center;">Your contest logs</h2>
            ${appState.pastContestLogs.map(e => `
              <div class="card" style="display:flex; justify-space-between; align-items:center;">
                <span style="font-weight: bold; font-size: 16px;">${e.title} (Completed ${e.date})</span>
                <button class="btn">View</button>
              </div>
            `).join("")}
            <div style="text-align: right; margin-top: 20px;">
              <button class="btn" onclick="appState.logFlowStep=0; renderApp();">Add new log</button>
            </div>
          </div>
        `;
      }
      if (0 === appState.logFlowStep) {
        return `
          <div class="grid-2">
            <div class="card">
              <h3>Log a contest</h3>
              <input type="text" value="AMC 10 2016" placeholder="Search contest...">
              <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn" onclick="appState.selectedContest='AMC 10A 2016'; appState.logFlowStep=1; renderApp();">AMC 10A 2016 (Total time: 75 min)</button>
                <button class="btn" onclick="appState.selectedContest='AMC 10B 2016'; appState.logFlowStep=1; renderApp();">AMC 10B 2016 (Total time: 75 min)</button>
                <button class="btn" onclick="appState.selectedContest='AIME I 2016'; appState.logFlowStep=1; renderApp();">AIME I 2016 (Total time: 180 min)</button>
              </div>
              <br>
              <button class="btn" onclick="appState.logFlowStep='history'; renderApp();">View past contest logs</button>
            </div>
            <div class="card">
              <h3>Suggested for you:</h3>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn" onclick="appState.selectedContest='AMC 10A 2016'; appState.logFlowStep=1; renderApp();">Log AMC 10A 2016</button>
                <button class="btn" onclick="appState.selectedContest='AIME II 2021'; appState.logFlowStep=1; renderApp();">Log AIME II 2021</button>
                <button class="btn" onclick="appState.selectedContest='Mathcounts State Target 2018'; appState.logFlowStep=1; renderApp();">Log Mathcounts Target 2018</button>
              </div>
            </div>
          </div>
        `;
      }
      if (1 === appState.logFlowStep) {
        return `
          <div class="card">
            <h2>${appState.selectedContest} Log</h2>
            <div class="card">
              <h3>Testing conditions</h3>
              <label>Date completed:</label>
              <input type="date" id="logDateInput">
              <label>Mock/Real test:</label>
              <select><option>Mock</option><option>Real</option></select>
            </div>
            <div class="card">
              <h3>Score</h3>
              <label>Correct answers:</label><input type="number">
              <label>Incorrect answers:</label><input type="number">
              <label>Unanswered questions:</label><input type="number">
            </div>
            <button class="btn" onclick="appState.logFlowStep=2; renderApp();">Next</button>
          </div>
        `;
      }
      if (2 === appState.logFlowStep) {
        return `
          <div class="card">
            <h2>${appState.selectedContest} Log</h2>
            <div class="card">
              <h3>How did you think this test went?</h3>
              <textarea rows="3" placeholder="Answer:"></textarea>
            </div>
            <div class="card">
              <h3>What were you proud of in this test?</h3>
              <textarea rows="3" placeholder="Answer:"></textarea>
            </div>
            <button class="btn" onclick="appState.logFlowStep=3; renderApp();">Next</button>
          </div>
        `;
      }
      if (3 === appState.logFlowStep) {
        return `
          <div class="card">
            <h2>${appState.selectedContest} Log</h2>
            <div class="card">
              <h3>What was something that you wish could have gone better?</h3>
              <textarea rows="3" placeholder="Answer:"></textarea>
            </div>
            <div class="card">
              <h3>What concepts or test-taking strategies did you learn from this test?</h3>
              <textarea rows="3" placeholder="Answer:"></textarea>
            </div>
            <button class="btn" onclick="completeContestLogging()">Submit</button>
          </div>
        `;
      }
      if (4 === appState.logFlowStep) {
        return `
          <div class="card" style="text-align: center; padding: 40px;">
            <div style="font-size: 50px;">🎉 🎊</div>
            <h2>Your contest: "${appState.selectedContest}" Logged successfully!</h2>
            <br>
            <button class="btn" onclick="appState.logFlowStep=0; renderApp();">Back to Home</button>
          </div>
        `;
      }
    }

    function completeContestLogging() {
      const e = new Date();
      const t = `${e.getMonth() + 1}/${e.getDate()}/${e.getFullYear().toString().substr(-2)}`;
      const log = { id: Date.now(), title: appState.selectedContest, date: t };
      appState.pastContestLogs.unshift(log);
      fetch("/api/contest-logs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(log)
      }).catch(() => {});
      appState.logFlowStep = 4;
      renderApp();
    }

    function renderCommunity() {
      const e = `
        <div>
          <div class="card" style="cursor: pointer;" onclick="appState.communityStep='responses'; renderApp();">
            <h4>Question of the Week: In what ways do you notice your gender identity impacts your experience in competitive math?</h4>
            <p style="color:red; font-size:12px; margin: 4px 0 0 0;">Time until update: 3 days</p>
            <p style="color:#888; font-size:13px; margin-top:8px; text-align:center;">Click to expand</p>
          </div>
          <div class="card" style="cursor: pointer; text-align: center;" onclick="appState.communityStep='post'; renderApp();">
            <h3>Post response</h3>
          </div>
          <div class="card" style="cursor: pointer; text-align: center;" onclick="appState.communityStep='past_qow'; renderApp();">
            <h3>Past Question of the Weeks</h3>
          </div>
          <div class="card" style="cursor: pointer; text-align: center;" onclick="appState.communityStep='suggest_qow'; renderApp();">
            <h3>Suggest a question</h3>
          </div>
        </div>
      `;

      if ("past_qow" === appState.communityStep) {
        return `
          <div class="grid-2">
            <div>
              <div class="card">
                <h3 style="text-align:center; margin-bottom: 2px;">Past Question of the Weeks</h3>
                <p style="text-align:center; color:#888; font-size:12px; margin-top:0;">Click to expand</p>

                <div class="card" style="cursor:pointer;" onclick="appState.communityStep='responses'; renderApp();">
                  <h4>Question of the Week: How do you calm yourself down in a messy situation?</h4>
                  <p style="color:#888; font-size:12px;">See responses</p>
                  <div style="text-align:right; color:red; font-weight:bold; font-size:13px;">January 15, 2099</div>
                </div>

                <div class="card" style="cursor:pointer;" onclick="appState.communityStep='responses'; renderApp();">
                  <h4>Question of the Week: Which is your favorite rabbit?</h4>
                  <p style="color:#888; font-size:12px;">See responses</p>
                  <div style="text-align:right; color:red; font-weight:bold; font-size:13px;">January 8, 2099</div>
                </div>

                <div class="card" style="cursor:pointer;" onclick="appState.communityStep='responses'; renderApp();">
                  <h4>Question of the Week: How do you deal with constant comparison and peer pressure?</h4>
                  <p style="color:#888; font-size:12px;">See responses</p>
                  <div style="text-align:right; color:red; font-weight:bold; font-size:13px;">January 1, 2099</div>
                </div>
              </div>
            </div>
            ${e}
          </div>
        `;
      }
      if ("default" === appState.communityStep) {
        return `
          <div class="grid-2">
            <div>
              <div class="card">
                <h3 style="text-align:center; margin-bottom: 2px;">Community Advice</h3>
                <p style="text-align:center; color:#888; font-size:12px; margin-top:0;">Click to expand</p>

                <div class="card" style="display:flex; align-items:center; gap: 10px;">
                  <span>🔍</span>
                  <span style="font-weight:bold;">How do I get better at taking tests?</span>
                </div>

                <div class="card">
                  <h4>How do I improve test taking in math competitions?</h4>
                  <p style="color:#888; font-size:12px; margin:0;">Asked by Flopsy on July 10th 1967</p>
                  <p style="color:#888; font-size:12px; margin:0;">1,543 replies</p>
                </div>

                <div class="card">
                  <h4>How do I reduce test-day stress?</h4>
                  <p style="color:#888; font-size:12px; margin:0;">Asked by Rice on July 10th 2003</p>
                  <p style="color:#888; font-size:12px; margin:0;">321 replies</p>
                </div>

                <div style="text-align: right; margin-top: 15px;">
                  <button class="btn" onclick="alert('Ask a question modal!')">+ Ask a question</button>
                </div>
              </div>
            </div>
            ${e}
          </div>
        `;
      }
      if ("suggest_qow" === appState.communityStep) {
        return `
          <div class="grid-2">
            <div>
              <div class="card" style="min-height: 380px; display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                  <h3 style="text-align:center; margin-bottom:2px;">Suggest a question</h3>
                  <p style="text-align:center; color:#888; font-size:12px; margin-top:0;">Click to expand</p>
                  <textarea rows="5" placeholder="Click to add text" style="margin-top:20px;"></textarea>
                </div>

                <div style="text-align: right;">
                  <button class="btn" onclick="alert('Question submitted!'); appState.communityStep='default'; renderApp();">+ Submit Question</button>
                </div>
              </div>
            </div>
            ${e}
          </div>
        `;
      }
      if ("post" === appState.communityStep) {
        return `
          <div class="grid-2">
            <div>
              <div class="card">
                <h2>Post a Response</h2>
                <div class="card">
                  <h4>Question of the Week:</h4>
                  <p><b>In what ways do you notice your gender identity impacts your experience in competitive math?</b></p>
                </div>
                <div class="card">
                  <label><b>Your Response:</b></label>
                  <textarea id="communityResponseText" rows="5" placeholder="Type your response here..."></textarea>
                </div>
                <button class="btn" onclick="submitCommunityResponse()">Submit Response</button>
                <button class="btn" style="margin-left: 8px;" onclick="appState.communityStep='default'; renderApp();">Cancel</button>
              </div>
            </div>
            ${e}
          </div>
        `;
      }
      return `
        <div class="grid-2">
          <div>
            <div class="card">
              <h3>Community Responses</h3>
              ${appState.communityResponses.map(e => `
                <div class="response-card">
                  <b>${e.author}'s response:</b>
                  <p>${e.text || "<i>(No response text)</i>"}</p>
                  <small>Date: ${e.date}</small>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 8px;">
                    <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="likePost(${e.id})">❤️ Like (${e.likes})</button>
                    <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #ef4444;" onclick="reportPost(${e.id}, '${e.author}')">Report</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
          ${e}
        </div>
      `;
    }

    function likePost(e) {
      const t = appState.communityResponses.find(t => t.id === e);
      if (t) {
        t.likes++;
        renderApp();
      }
    }

    function reportPost(e, t) {
      const s = prompt(`Why are you reporting ${t}'s post?`);
      if (s && s.trim()) {
        const n = encodeURIComponent(`Report Post ID #${e} by ${t}`);
        const a = encodeURIComponent(`Post ID: ${e}\nAuthor: ${t}\nReporter: ${appState.user.username}\nReason: ${s}`);
        window.location.href = `mailto:araluensrag@gmail.com?subject=${n}&body=${a}`;
      }
    }

    function submitCommunityResponse() {
      const e = document.getElementById("communityResponseText");
      const t = e ? e.value : "";
      if (t.trim()) {
        const post = {
          id: Date.now(),
          author: appState.user.username,
          text: t,
          date: new Date().toISOString().split("T")[0],
          likes: 0
        };
        appState.communityResponses.push(post);
        fetch("/api/community/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(post)
        }).catch(() => {});
      }
      appState.communityStep = "responses";
      renderApp();
    }

    function renderAboutUs() {
      return `
        <div class="grid-2">
          <div class="card">
            <h3>Elaine Zhou</h3>
            <p><b>Where this website idea came from: </b> I started competition math in 5th grade, but often focused only on my score instead of what I actually learned. Over time, I realized that constant comparison was becoming unhealthy, and I realized that math is so much more than what you get on one test on one day. I hope this website can provide those who are stressed with support, help people learn math without always focusing on getting something right or wrong, and foster a fun and welcoming community!</p>
          </div>
          <div class="card">
            <h3>Catherine Pennington</h3>
            <p><b>Why I wanted to build this website:</b> Through competition math, not only was I able to get better at math, but I was also able to build my own work ethic, make friends, and discover how fun it is to think! Through this website, I want to expand access to competition math -- but not just through problems. Math is so much more fun when you have a community to cheer you on and help you when you need help -- and I hope this website can provide that community!</p>
          </div>
        </div>
        <div class="card">
          <h3>Sarah Li</h3>
          <p><b>What this website means to me:</b> When I started to learn more about competition math, I wanted to improve, but I didn't know when to start, and what was enough. I also got into this field relatively late (in 7th grade), and often got lost and didn't know what to do. I believe many students out there share the same struggles as I had, so in co-creating this website, I hope to foster a community that guides people of all age ranges and skill levels in an environment free of comparison and self-denial.</p>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card" style="padding: 30px;">
          <div style="display:flex; gap: 30px; align-items:center;">
            <div class="profile-avatar" onclick="triggerPfpUpload()">
              ${appState.pfpUrl ? `<img src="${appState.pfpUrl}" alt="Profile Picture">` : '<svg width="120" height="120" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>'}
            </div>

            <div style="display:flex; flex-direction:column; gap: 15px; flex-grow: 1;">
              <button class="btn" style="width:100%; text-align:center;" onclick="const n = prompt('Enter new display name:', appState.user.username); if(n) { appState.user.username = n; renderApp(); }">
                Change display name
              </button>
              <button class="btn" style="width:100%; text-align:center;" onclick="promptChangeTheme()">
                Change display color (the only option is pink)
              </button>
            </div>
          </div>

          <div style="margin-top: 25px;">
            <button class="btn" style="width: auto;" onclick="triggerPfpUpload()">Select Profile Picture from Device</button>
          </div>
        </div>

        <div class="card">
          <h3>AI in Use</h3>
          <p><b>GPT-5.6 Luna</b></p>
          <p style="font-size:13px;color:#666;">
            The AI key is kept on the server, not in your browser. Your account can use the site's configured AI service without exposing credentials.
          </p>
        </div>
        <div class="card">
          <h3>Account</h3>
          <p><b>Username:</b> ${appState.user.username}</p>
          <p><b>Email:</b> ${appState.user.email || "Not provided"}</p>
          <button class="btn google-btn" onclick="window.location.href='/auth/google/link'">
            Link Google account
          </button>
        </div>
      `;
    }

    function triggerPfpUpload() {
      document.getElementById("pfpFileInput").click();
    }

    function handlePfpUpload(e) {
      const t = e.target.files[0];
      if (t) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          appState.pfpUrl = evt.target.result;
          renderApp();
        };
        reader.readAsDataURL(t);
      }
    }


    function setAuthMode(mode) {
      appState.authMode = mode;
      appState.authError = "";
      const isRegister = mode === "register";
      document.getElementById("authSubmit").textContent = isRegister ? "Create account" : "Log in";
      document.getElementById("authEmailWrap").style.display = isRegister ? "block" : "none";
      document.getElementById("authEmail").required = isRegister;
      document.getElementById("authError").textContent = "";
    }

    async function submitAuth(event) {
      event.preventDefault();
      const mode = appState.authMode;
      const body = {
        username: document.getElementById("authUsername").value.trim(),
        password: document.getElementById("authPassword").value
      };
      if (mode === "register") body.email = document.getElementById("authEmail").value.trim();

      const endpoint = mode === "register" ? "/api/auth/register" : "/api/auth/login";
      const button = document.getElementById("authSubmit");
      button.disabled = true;
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Authentication failed");
        await loadCurrentUser();
      } catch (err) {
        document.getElementById("authError").textContent = err.message;
      } finally {
        button.disabled = false;
      }
    }

    async function loadCurrentUser() {
      const response = await fetch("/api/me");
      const data = await response.json();
      if (!data.user) {
        appState.authenticated = false;
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app-container").style.display = "none";
        setAuthMode("login");
        return;
      }
      appState.authenticated = true;
      appState.user = data.user;
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-container").style.display = "block";
      renderApp();
    }

    async function logout() {
      await fetch("/api/auth/logout", { method: "POST" });
      appState.authenticated = false;
      appState.aiChatHistory = [];
      await loadCurrentUser();
    }

    async function loadUserData() {
      try {
        const response = await fetch("/api/data");
        if (!response.ok) return;
        const data = await response.json();
        if (data.contestLogs) appState.pastContestLogs = data.contestLogs;
        if (data.communityResponses) appState.communityResponses = data.communityResponses;
      } catch (_) {}
    }

    // Initialize application
    setTheme(appState.currentTheme);
    loadCurrentUser().then(() => loadUserData());
  </script>
</body>
</html>
